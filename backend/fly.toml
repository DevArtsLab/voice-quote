# fly.toml app configuration file generated for quote-builder-backend on 2026-06-01T00:03:53-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'quote-builder-backend'
primary_region = 'iad'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  LLM_BASE_URL = 'https://api.cloudflare.com/client/v4/accounts/2d2958f6b06a047cb36b346a0ab01056/ai/v1'
  LLM_MODEL = '@cf/meta/llama-3.3-70b-instruct-fp8-fast'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
