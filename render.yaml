services:
  # ── Backend: Node/Express + GraphQL + WebSockets ──────────────────────────
  - type: web
    name: quote-builder-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false # set manually in Render dashboard
      - key: VAPI_API_KEY
        sync: false
      - key: VAPI_ASSISTANT_ID
        sync: false
      - key: FRONTEND_URL
        sync: false # set to your Render frontend URL after first deploy
      - key: PORT
        value: 10000 # Render assigns PORT=10000 by default

  # ── Frontend: Angular SPA ─────────────────────────────────────────────────
  - type: web
    name: quote-builder-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist/frontend/browser
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_BASE_URL
        value: https://quote-builder-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
